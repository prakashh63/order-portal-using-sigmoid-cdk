name: Destroy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to destroy
        type: choice
        options: [dev, staging]
        required: true
      confirm:
        description: Type the stage name again to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == inputs.stage
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      AWS_REGION: ap-southeast-2
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify AWS secrets are set
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "AWS_ACCESS_KEY_ID is EMPTY"; exit 1; fi
          if [ -z "$AWS_SECRET_ACCESS_KEY" ]; then echo "AWS_SECRET_ACCESS_KEY is EMPTY"; exit 1; fi
          echo "Both AWS secrets are present"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt && npm install -g aws-cdk

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Empty the S3 buckets
        run: |
          aws s3 rm s3://order-portal-web-${STAGE}-demo --recursive || true
          aws s3 rm s3://order-portal-data-${STAGE}-demo --recursive || true

      - name: Destroy stack
        run: cdk destroy --all --force