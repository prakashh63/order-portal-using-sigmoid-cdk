name: Destroy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to destroy
        type: choice
        options: [dev, staging]
        required: true
      confirm:
        description: Type the stage name again to confirm
        required: true

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.stage }}
  cancel-in-progress: false

jobs:
  destroy:
    if: inputs.confirm == inputs.stage
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      STAGE: ${{ inputs.stage }}
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt && npm install -g aws-cdk

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Empty the S3 buckets
        run: |
          aws s3 rm s3://order-portal-web-${STAGE}-demo --recursive || true
          aws s3 rm s3://order-portal-data-${STAGE}-demo --recursive || true

      - name: Destroy stack
        run: cdk destroy --all --force