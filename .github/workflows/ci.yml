name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Allow pip to read the private sigmoid-cdk repo
        run: git config --global url."https://x-access-token:${{ secrets.SIGMOID_CDK_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: pip install -r requirements.txt && npm install -g aws-cdk
      - run: cdk synth --quiet